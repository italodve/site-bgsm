<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Entrar · Painel Imobiliária Vilas Cabral</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 600px at 70% -10%, #2a2e36 0%, #15171c 55%, #0c0d10 100%);
        color: #f0f1f4;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(189, 156, 75, 0.35);
        border-radius: 16px;
        padding: 36px 32px;
        backdrop-filter: blur(6px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .brand {
        text-align: center;
        margin-bottom: 28px;
      }
      .brand strong {
        display: block;
        font-size: 1.5rem;
        letter-spacing: 0.14em;
        color: #d9a85a;
      }
      .brand span {
        font-size: 0.85rem;
        color: #b9bdc6;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: #b9bdc6;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 18px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(12, 13, 16, 0.7);
        color: #f0f1f4;
        font-size: 0.95rem;
      }
      input:focus {
        outline: none;
        border-color: #d9a85a;
      }
      button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #d8bc72, #a8873d);
        color: #15171c;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .error {
        display: none;
        margin-bottom: 18px;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(214, 69, 69, 0.15);
        border: 1px solid rgba(214, 69, 69, 0.4);
        color: #ffb4b4;
        font-size: 0.85rem;
      }
      .error.is-visible {
        display: block;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 0.82rem;
        color: #b9bdc6;
        text-decoration: none;
      }
      .back:hover {
        color: #d9a85a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <strong>Imobiliária Vilas Cabral</strong>
        <span>Painel de Imóveis e Leads</span>
      </div>
      <p class="error" data-error>Usuário ou senha incorretos. Tente novamente.</p>
      <form method="post" action="/painel/login">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus />
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
      </form>
      <a class="back" href="/">← Voltar ao site</a>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("erro")) {
        document.querySelector("[data-error]").classList.add("is-visible");
      }
    </script>
  </body>
</html>
